<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risicodossier — A.Hak Electron</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --border: #2a3347;
    --border2: #3a4a66;
    --accent: #3b7fff;
    --accent2: #1a5ce8;
    --text: #e8ecf4;
    --text2: #8a9bb8;
    --text3: #5a6b85;
    --green: #22c97a;
    --yellow: #f0b429;
    --red: #f05252;
    --orange: #f97316;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }
  
  /* Layout */
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: 0.05em; }
  .project-badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--text2); font-family: var(--mono); }
  .topbar-right { display: flex; gap: 8px; }
  
  .main { display: flex; flex: 1; }
  .sidebar { width: 200px; background: var(--bg2); border-right: 1px solid var(--border); padding: 16px 0; flex-shrink: 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer; color: var(--text2); font-size: 13px; transition: all 0.15s; border-left: 2px solid transparent; }
  .nav-item:hover { color: var(--text); background: var(--bg3); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(59,127,255,0.08); }
  .nav-icon { width: 16px; text-align: center; }
  
  .content { flex: 1; padding: 24px; overflow-y: auto; }
  .page { display: none; }
  .page.active { display: block; }
  
  /* Project setup */
  .setup-wrap { max-width: 560px; margin: 0 auto; padding-top: 20px; }
  .setup-header { margin-bottom: 28px; }
  .setup-header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .setup-header p { color: var(--text2); font-size: 13px; }
  
  /* Cards */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }
  
  /* Form elements */
  .form-grid { display: grid; gap: 12px; }
  .form-grid-2 { grid-template-columns: 1fr 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; color: var(--text2); }
  input, textarea, select { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--sans); font-size: 13px; padding: 8px 10px; outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  select option { background: var(--bg3); }
  
  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: var(--sans); white-space: nowrap; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border2); }
  .btn-success { background: rgba(34,201,122,0.15); color: var(--green); border: 1px solid rgba(34,201,122,0.25); }
  .btn-success:hover { background: rgba(34,201,122,0.25); }
  .btn-danger { background: rgba(240,82,82,0.12); color: var(--red); border: 1px solid rgba(240,82,82,0.2); }
  .btn-danger:hover { background: rgba(240,82,82,0.22); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-icon { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; border: none; transition: all 0.15s; }
  
  /* Risk list */
  .risk-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
  .risk-toolbar-left { display: flex; gap: 8px; align-items: center; }
  .search-input { width: 220px; }
  
  .risk-table { width: 100%; border-collapse: collapse; }
  .risk-table th { text-align: left; padding: 8px 10px; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); font-weight: 500; }
  .risk-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .risk-table tr:hover td { background: rgba(255,255,255,0.02); }
  .risk-table .col-id { width: 50px; font-family: var(--mono); font-size: 12px; color: var(--text3); }
  .risk-table .col-event { max-width: 280px; }
  .risk-table .col-score { width: 70px; text-align: center; }
  .risk-table .col-status { width: 90px; }
  .risk-table .col-actions { width: 80px; text-align: right; }
  .event-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); }
  .event-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  
  /* Status badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-concept { background: rgba(90,107,133,0.2); color: var(--text3); }
  .badge-voorstel { background: rgba(240,180,41,0.15); color: var(--yellow); }
  .badge-vigerend { background: rgba(59,127,255,0.15); color: var(--accent); }
  .badge-actueel { background: rgba(249,115,22,0.15); color: var(--orange); }
  .badge-beheerst { background: rgba(34,201,122,0.15); color: var(--green); }
  .badge-vervallen { background: rgba(90,107,133,0.12); color: var(--text3); }
  .badge-opgetreden { background: rgba(240,82,82,0.15); color: var(--red); }
  
  /* Score display */
  .score-pill { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .score-0 { background: rgba(90,107,133,0.15); color: var(--text3); }
  .score-1,.score-2 { background: rgba(34,201,122,0.15); color: var(--green); }
  .score-3,.score-4 { background: rgba(240,180,41,0.15); color: var(--yellow); }
  .score-5,.score-6 { background: rgba(249,115,22,0.15); color: var(--orange); }
  .score-7 { background: rgba(240,82,82,0.15); color: var(--red); }
  .score-composite { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  
  /* Risk detail / edit panel */
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-size: 15px; font-weight: 600; }
  .panel-body { padding: 20px; }
  
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab { padding: 9px 16px; font-size: 13px; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  
  /* Scores grid */
  .scores-section { margin-bottom: 20px; }
  .scores-label { font-size: 12px; color: var(--text2); margin-bottom: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
  .scores-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .score-input-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
  .score-input-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
  .score-input-card input { background: transparent; border: none; text-align: center; font-family: var(--mono); font-size: 18px; font-weight: 600; padding: 0; width: 100%; color: var(--text); }
  .score-input-card input:focus { outline: none; }
  
  /* AI button */
  .ai-btn { background: linear-gradient(135deg, rgba(59,127,255,0.2), rgba(138,77,255,0.2)); border: 1px solid rgba(59,127,255,0.4); color: var(--accent); display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: var(--sans); }
  .ai-btn:hover { background: linear-gradient(135deg, rgba(59,127,255,0.3), rgba(138,77,255,0.3)); }
  .ai-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ai-spinner { width: 14px; height: 14px; border: 2px solid rgba(59,127,255,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Toast */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--text); z-index: 1000; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; max-width: 320px; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.toast-success { border-color: rgba(34,201,122,0.4); }
  .toast.toast-error { border-color: rgba(240,82,82,0.4); }
  
  /* Dashboard */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-value { font-size: 28px; font-family: var(--mono); font-weight: 600; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }
  
  /* Table scroll wrapper */
  .table-wrap { overflow-x: auto; }
  
  /* Empty state */
  .empty { text-align: center; padding: 48px 20px; color: var(--text3); }
  .empty-icon { font-size: 32px; margin-bottom: 12px; }
  .empty p { margin-bottom: 16px; }
  
  /* Divider */
  hr.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  
  /* Row actions */
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  
  /* Back btn */
  .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; cursor: pointer; margin-bottom: 16px; padding: 4px 0; }
  .back-btn:hover { color: var(--text); }
  
  /* Notification dot */
  .notif { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 4px; vertical-align: middle; }
  
  /* Progress bar */
  .prog-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 6px; }
  .prog-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.3s; }
  
  /* Responsive */
  @media (max-width: 700px) {
    .sidebar { display: none; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .scores-grid { grid-template-columns: repeat(3, 1fr); }
    .form-grid-2 { grid-template-columns: 1fr; }
  }

  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-family: var(--mono); }
  .tag-bouwteam { background: rgba(59,127,255,0.12); color: var(--accent); }
  .tag-liander { background: rgba(34,201,122,0.12); color: var(--green); }
  .tag-ahak { background: rgba(249,115,22,0.12); color: var(--orange); }

  /* Import page */
  .dropzone { border: 2px dashed var(--border2); border-radius: var(--radius); padding: 40px 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg2); }
  .dropzone:hover, .dropzone.drag-over { border-color: var(--accent); background: rgba(59,127,255,0.05); }
  .dropzone-icon { font-size: 32px; margin-bottom: 12px; }
  .dropzone p { color: var(--text2); font-size: 13px; margin-bottom: 6px; }
  .dropzone small { color: var(--text3); font-size: 11px; }
  .import-preview { margin-top: 20px; }
  .import-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; background: var(--bg3); border: 1px solid var(--border); margin-bottom: 6px; font-size: 13px; }
  .import-row-num { font-family: var(--mono); font-size: 11px; color: var(--text3); min-width: 24px; }
  .import-row-text { flex: 1; color: var(--text); }
  .import-row-status { font-size: 11px; min-width: 80px; text-align: right; }
  .import-status-waiting { color: var(--text3); }
  .import-status-running { color: var(--accent); display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .import-status-done { color: var(--green); }
  .import-status-error { color: var(--red); }
  .import-progress { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; }
  .import-progress-label { font-size: 13px; color: var(--text2); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .prog-bar { height: 6px; background: var(--bg3); border-radius: 3px; }
  .prog-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// Config
const SUPABASE_URL = 'https://hjizveuklymmobqzsglb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqaXp2ZXVrbHltbW9icXpzZ2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNTkyNjAsImV4cCI6MjA5MjczNTI2MH0.PRyNwCicqg1IaYe7-QlGIGmHljFpaYdel4tmLVGD5vU';
const AI_MODEL = 'claude-sonnet-4-20250514';

const STATUS_LIST = ['Concept','Voorstel','Vigerend','Actueel','Beheerst','Vervallen','Opgetreden'];
const FASE_LIST = ['Bouwteam','Uitvoering','NAOK','Ontwerp'];
const ALLOC_LIST = ['Bouwteam','Liander','A.Hak'];

const SCORE_LABELS = ['Kans','Tijd','Geld','Kwaliteit','Veiligheid','Omgeving'];
const SCORE_KEYS_I = ['kans_i','tijd_i','geld_i','kwaliteit_i','veiligheid_i','omgeving_i'];
const SCORE_KEYS_R = ['kans_r','tijd_r','geld_r','kwaliteit_r','veiligheid_r','omgeving_r'];
const SCORE_KEYS_A = ['kans_a','tijd_a','geld_a','kwaliteit_a','veiligheid_a','omgeving_a'];

// Supabase helpers
async function sbFetch(path, opts = {}) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

// Toast
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type ? 'toast-' + type : ''}`;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

// Score color class
function scoreClass(v) {
  const n = parseInt(v) || 0;
  return `score-${Math.min(n, 7)}`;
}

// Composite risk score
// Correct risico formula: Kans × SOM(Tijd+Geld+Kwaliteit+Veiligheid+Omgeving)
function riskScore(r, prefix) {
  const k = r[`kans_${prefix}`] || 0;
  const t = r[`tijd_${prefix}`] || 0;
  const g = r[`geld_${prefix}`] || 0;
  const kw = r[`kwaliteit_${prefix}`] || 0;
  const v = r[`veiligheid_${prefix}`] || 0;
  const o = r[`omgeving_${prefix}`] || 0;
  return k * (t + g + kw + v + o);
}

// Kwantificeertabel kleine projecten
const KANS_REKENWAARDE = [0, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.70];
const GELD_REKENWAARDE = [0, 2500, 7500, 17500, 37500, 67500, 87500, 100000];
const TIJD_TEKST = ['Geen impact','< 0.5 week','0.5 - 1 week','1 - 2 weken','2 - 4 weken','4 - 6 weken','6 - 8 weken','> 2 maanden'];

function berekenRestrisico(r, prefix) {
  const kans = r[`kans_${prefix}`] || 0;
  const geld = r[`geld_${prefix}`] || 0;
  const tijd = r[`tijd_${prefix}`] || 0;
  const kansRw = KANS_REKENWAARDE[Math.min(kans, 7)];
  const geldRw = GELD_REKENWAARDE[Math.min(geld, 7)];
  const tijdTekst = TIJD_TEKST[Math.min(tijd, 7)];
  const restrisicoBedrag = kansRw * geldRw;
  return { kansRw, geldRw, restrisicoBedrag, tijdTekst };
}

// Status badge class
function statusClass(s) {
  if (!s) return 'badge-concept';
  return `badge-${s.toLowerCase()}`;
}

// AI analysis via server-side proxy
async function analyzeRisk(gebeurtenis) {
  const resp = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gebeurtenis })
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
  if (data.error) throw new Error(data.error);
  // data is already parsed JSON from the proxy
  return data;
}

// Project setup page
function ProjectSetup({ project, onSave }) {
  const [form, setForm] = useState(project || { naam: '', nummer: '', tsb: '', opsteller: '', datum_actualisatie: new Date().toISOString().slice(0, 10) });
  const [saving, setSaving] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async () => {
    if (!form.naam.trim()) { showToast('Projectnaam is verplicht', 'error'); return; }
    setSaving(true);
    try {
      let result;
      if (project?.id) {
        result = await sbFetch(`/risico_projecten?id=eq.${project.id}`, {
          method: 'PATCH', body: JSON.stringify(form)
        });
      } else {
        result = await sbFetch('/risico_projecten', { method: 'POST', body: JSON.stringify(form) });
      }
      showToast('Project opgeslagen', 'success');
      onSave(result?.[0] || result);
    } catch (e) { showToast('Fout: ' + e.message, 'error'); }
    setSaving(false);
  };

  return (
    <div className="setup-wrap">
      <div className="setup-header">
        <h1>Projectgegevens</h1>
        <p>Stel de basisgegevens van het risicodossier in.</p>
      </div>
      <div className="card">
        <div className="card-title">Project</div>
        <div className="form-grid form-grid-2">
          <div className="form-group" style={{gridColumn:'1/-1'}}>
            <label>Projectnaam *</label>
            <input value={form.naam} onChange={e => set('naam', e.target.value)} placeholder="bijv. Zuiderdijkweg Wieringerwerf" />
          </div>
          <div className="form-group">
            <label>Projectnummer</label>
            <input value={form.nummer} onChange={e => set('nummer', e.target.value)} placeholder="bijv. 34938A" />
          </div>
          <div className="form-group">
            <label>TSB (€)</label>
            <input type="number" value={form.tsb} onChange={e => set('tsb', e.target.value)} placeholder="585992" />
          </div>
          <div className="form-group">
            <label>Opsteller</label>
            <input value={form.opsteller} onChange={e => set('opsteller', e.target.value)} placeholder="naam opsteller" />
          </div>
          <div className="form-group">
            <label>Datum actualisatie</label>
            <input type="date" value={form.datum_actualisatie} onChange={e => set('datum_actualisatie', e.target.value)} />
          </div>
        </div>
      </div>
      <button className="btn btn-primary" onClick={save} disabled={saving}>
        {saving ? 'Opslaan...' : project?.id ? 'Wijzigingen opslaan' : 'Project aanmaken →'}
      </button>
    </div>
  );
}

// Risk row in table
function RiskRow({ risk, onEdit, onDelete }) {
  const si = riskScore(risk, 'i');
  const sr = riskScore(risk, 'r');
  return (
    <tr>
      <td className="col-id">{risk.volgnummer}</td>
      <td className="col-event">
        <div className="event-text">{risk.gebeurtenis || <span style={{color:'var(--text3)'}}>—</span>}</div>
        {risk.eigenaar && <div className="event-sub">{risk.eigenaar}</div>}
      </td>
      <td className="col-status"><span className={`badge ${statusClass(risk.status)}`}>{risk.status || 'Concept'}</span></td>
      <td className="col-score">
        {si > 0 ? <span className={`score-pill ${scoreClass(si)}`}>{si}</span> : <span style={{color:'var(--text3)'}}>—</span>}
      </td>
      <td className="col-score">
        {sr > 0 ? <span className={`score-pill ${scoreClass(sr)}`}>{sr}</span> : <span style={{color:'var(--text3)'}}>—</span>}
      </td>
      <td className="col-score">
        {(() => { const sa = riskScore(risk, 'a'); return sa > 0 ? <span className={`score-pill ${scoreClass(sa)}`}>{sa}</span> : <span style={{color:'var(--text3)'}}>—</span>; })()}
      </td>
      <td className="col-actions">
        <div className="row-actions">
          <button className="btn btn-icon btn-secondary" title="Bewerken" onClick={() => onEdit(risk)}>✏️</button>
          <button className="btn btn-icon btn-danger" title="Verwijderen" onClick={() => onDelete(risk)}>🗑</button>
        </div>
      </td>
    </tr>
  );
}

// Score input grid
function ScoreGrid({ prefix, values, onChange }) {
  return (
    <div className="scores-grid">
      {SCORE_LABELS.map((label, i) => {
        const key = prefix === 'i' ? SCORE_KEYS_I[i] : prefix === 'r' ? SCORE_KEYS_R[i] : SCORE_KEYS_A[i];
        const val = values[key] || '';
        return (
          <div key={key} className="score-input-card">
            <div className="score-input-label">{label}</div>
            <input
              type="number" min="0" max="7"
              value={val}
              onChange={e => onChange(key, Math.min(7, Math.max(0, parseInt(e.target.value) || 0)))}
              className={scoreClass(val)}
            />
          </div>
        );
      })}
    </div>
  );
}

// Risk editor
function RiskEditor({ risk, onSave, onCancel, nextNum }) {
  const isNew = !risk?.id;
  const [form, setForm] = useState(risk || {
    volgnummer: nextNum,
    gebeurtenis: '', oorzaken: '', gevolgen: '', beheersmaatregelen: '',
    kans_i: 0, tijd_i: 0, geld_i: 0, kwaliteit_i: 0, veiligheid_i: 0, omgeving_i: 0,
    kans_r: 0, tijd_r: 0, geld_r: 0, kwaliteit_r: 0, veiligheid_r: 0, omgeving_r: 0,
    kans_a: 0, tijd_a: 0, geld_a: 0, kwaliteit_a: 0, veiligheid_a: 0, omgeving_a: 0,
    eigenaar: '', status: 'Concept', fase: '', allocatie: '', actiehouder: '', toelichting: '',
    opmerking: ''
  });
  const [tab, setTab] = useState('omschrijving');
  const [aiLoading, setAiLoading] = useState(false);
  const [saving, setSaving] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const runAI = async () => {
    if (!form.gebeurtenis.trim()) { showToast('Voer eerst een ongewenste gebeurtenis in', 'error'); return; }
    setAiLoading(true);
    try {
      const result = await analyzeRisk(form.gebeurtenis);
      setForm(f => ({
        ...f,
        oorzaken: result.oorzaken || f.oorzaken,
        gevolgen: result.gevolgen || f.gevolgen,
        beheersmaatregelen: result.beheer || f.beheersmaatregelen,
        kans_i: result.kans_i ?? f.kans_i,
        tijd_i: result.tijd_i ?? f.tijd_i,
        geld_i: result.geld_i ?? f.geld_i,
        kwaliteit_i: result.kwaliteit_i ?? f.kwaliteit_i,
        veiligheid_i: result.veiligheid_i ?? f.veiligheid_i,
        omgeving_i: result.omgeving_i ?? f.omgeving_i,
        kans_r: result.kans_r ?? f.kans_r,
        tijd_r: result.tijd_r ?? f.tijd_r,
        geld_r: result.geld_r ?? f.geld_r,
        kwaliteit_r: result.kwaliteit_r ?? f.kwaliteit_r,
        veiligheid_r: result.veiligheid_r ?? f.veiligheid_r,
        omgeving_r: result.omgeving_r ?? f.omgeving_r,
        opmerking: result.toelichting || f.opmerking
      }));
      showToast('AI-analyse klaar — controleer en pas aan waar nodig', 'success');
      setTab('omschrijving');
    } catch (e) { showToast('AI-fout: ' + e.message, 'error'); }
    setAiLoading(false);
  };

  const save = async () => {
    if (!form.gebeurtenis?.trim()) { showToast('Ongewenste gebeurtenis is verplicht', 'error'); return; }
    setSaving(true);
    try { await onSave(form); }
    catch (e) { showToast('Fout: ' + e.message, 'error'); }
    setSaving(false);
  };

  const si = riskScore(form, 'i');
  const sr = riskScore(form, 'r');

  return (
    <div>
      <div className="back-btn" onClick={onCancel}>← Terug naar overzicht</div>
      <div className="panel">
        <div className="panel-header">
          <div>
            <span style={{fontFamily:'var(--mono)',color:'var(--text3)',fontSize:'12px'}}>#{form.volgnummer}</span>
            <div className="panel-title">{isNew ? 'Nieuw risico' : 'Risico bewerken'}</div>
          </div>
          <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
            {si > 0 && <span style={{fontSize:'12px',color:'var(--text2)'}}>I: <span className={`score-pill ${scoreClass(si)}`}>{si}</span></span>}
            {sr > 0 && <span style={{fontSize:'12px',color:'var(--text2)'}}>R: <span className={`score-pill ${scoreClass(sr)}`}>{sr}</span></span>}
          </div>
        </div>
        <div className="panel-body">
          {/* Gebeurtenis always visible */}
          <div className="form-group" style={{marginBottom:'14px'}}>
            <label>Ongewenste gebeurtenis *</label>
            <textarea
              value={form.gebeurtenis}
              onChange={e => set('gebeurtenis', e.target.value)}
              placeholder="Beschrijf de ongewenste gebeurtenis..."
              rows={2}
            />
          </div>
          <div style={{marginBottom:'16px'}}>
            <button className="ai-btn" onClick={runAI} disabled={aiLoading}>
              {aiLoading ? <><div className="ai-spinner"/><span>Analyseren...</span></> : <><span>✦</span><span>AI-analyse genereren</span></>}
            </button>
            <span style={{fontSize:'11px',color:'var(--text3)',marginLeft:'10px'}}>Vult oorzaken, gevolgen, maatregelen en scores in</span>
          </div>

          <div className="tabs">
            {['omschrijving','scores','beheersing','details'].map(t => (
              <div key={t} className={`tab ${tab === t ? 'active' : ''}`} onClick={() => setTab(t)}>
                {t.charAt(0).toUpperCase() + t.slice(1)}
              </div>
            ))}
          </div>

          {tab === 'omschrijving' && (
            <div className="form-grid">
              <div className="form-group">
                <label>Oorzaken</label>
                <textarea value={form.oorzaken} onChange={e => set('oorzaken', e.target.value)} rows={4} placeholder="1. Oorzaak één&#10;2. Oorzaak twee" />
              </div>
              <div className="form-group">
                <label>Gevolgen</label>
                <textarea value={form.gevolgen} onChange={e => set('gevolgen', e.target.value)} rows={4} placeholder="1. Gevolg één&#10;2. Gevolg twee" />
              </div>
              <div className="form-group">
                <label>Opmerking / toelichting</label>
                <textarea value={form.opmerking} onChange={e => set('opmerking', e.target.value)} rows={3} />
              </div>
            </div>
          )}

          {tab === 'scores' && (
            <div>
              <div className="scores-section">
                <div className="scores-label">Initiële scores (voor beheersing)</div>
                <ScoreGrid prefix="i" values={form} onChange={set} />
              </div>
              <hr className="divider" />
              <div className="scores-section">
                <div className="scores-label">Restrisico scores (na beheersing)</div>
                <ScoreGrid prefix="r" values={form} onChange={set} />
              </div>
              <hr className="divider" />
              <div className="scores-section">
                <div className="scores-label">Actuele scores (huidige stand)</div>
                <ScoreGrid prefix="a" values={form} onChange={set} />
              </div>
              <hr className="divider" />
              {/* Berekeningen */}
              {['i','r','a'].map(prefix => {
                const score = riskScore(form, prefix);
                const { kansRw, geldRw, restrisicoBedrag, tijdTekst } = berekenRestrisico(form, prefix);
                const label = prefix === 'i' ? 'Initieel' : prefix === 'r' ? 'Restrisico' : 'Actueel';
                if (!score) return null;
                return (
                  <div key={prefix} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'6px',padding:'12px 16px',marginBottom:'8px'}}>
                    <div style={{fontSize:'11px',color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:'8px'}}>{label} — Berekening</div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>
                      <div>
                        <div style={{fontSize:'11px',color:'var(--text3)'}}>Risicoscore</div>
                        <div style={{fontFamily:'var(--mono)',fontSize:'18px',fontWeight:600,color:'var(--text)'}}>{score}</div>

          {tab === 'beheersing' && (
            <div className="form-grid">

// Dashboard
function Dashboard({ risks, project }) {
  const total = risks.length;
  const open = risks.filter(r => !['Vervallen','Beheerst'].includes(r.status)).length;
  const opgetreden = risks.filter(r => r.status === 'Opgetreden').length;
  const highRisk = risks.filter(r => riskScore(r, 'r') >= 25 || riskScore(r, 'i') >= 35).length;

  const statusCounts = STATUS_LIST.reduce((acc, s) => {
    acc[s] = risks.filter(r => r.status === s).length;
    return acc;
  }, {});

  const topRisks = [...risks]
    .filter(r => riskScore(r, 'i') > 0)
    .sort((a, b) => riskScore(b, 'i') - riskScore(a, 'i'))
    .slice(0, 5);

  return (
    <div>
      <div style={{marginBottom:'20px'}}>
        <h2 style={{fontSize:'18px',fontWeight:600}}>{project?.naam || 'Dashboard'}</h2>
        {project?.nummer && <span style={{fontFamily:'var(--mono)',color:'var(--text3)',fontSize:'12px'}}>{project.nummer}</span>}
      </div>
      <div className="stats-grid">
        <div className="stat-card"><div className="stat-value">{total}</div><div className="stat-label">Totaal risico's</div></div>
        <div className="stat-card"><div className="stat-value" style={{color:'var(--yellow)'}}>{open}</div><div className="stat-label">Open risico's</div></div>
        <div className="stat-card"><div className="stat-value" style={{color:'var(--red)'}}>{opgetreden}</div><div className="stat-label">Opgetreden</div></div>
        <div className="stat-card"><div className="stat-value" style={{color:'var(--orange)'}}>{highRisk}</div><div className="stat-label">Hoog risico</div></div>
      </div>

      {topRisks.length > 0 && (
        <div className="card">
          <div className="card-title">Top risico's — initieel</div>
          <table className="risk-table">
            <thead>
              <tr>
                <th style={{width:40}}>ID</th>
                <th>Gebeurtenis</th>
                <th style={{width:70}}>Score</th>
                <th style={{width:90}}>Status</th>
              </tr>
            </thead>
            <tbody>
              {topRisks.map(r => (
                <tr key={r.id}>
                  <td className="col-id">{r.volgnummer}</td>
                  <td><div className="event-text">{r.gebeurtenis}</div></td>
                  <td><span className={`score-pill ${scoreClass(riskScore(r,'i'))}`}>{riskScore(r,'i')}</span></td>
                  <td><span className={`badge ${statusClass(r.status)}`}>{r.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="card">
        <div className="card-title">Status verdeling</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
          {STATUS_LIST.map(s => (
            <div key={s} style={{minWidth:'100px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'6px',padding:'10px 14px'}}>
              <div style={{fontSize:'20px',fontFamily:'var(--mono)',fontWeight:600}}>{statusCounts[s]}</div>
              <div style={{fontSize:'11px',color:'var(--text2)',marginTop:'2px'}}>{s}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Risk list
function RiskList({ risks, onAdd, onEdit, onDelete }) {
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('');

  const filtered = risks.filter(r => {
    const q = search.toLowerCase();
    const matchSearch = !q || (r.gebeurtenis || '').toLowerCase().includes(q) || String(r.volgnummer).includes(q) || (r.eigenaar || '').toLowerCase().includes(q);
    const matchStatus = !filterStatus || r.status === filterStatus;
    return matchSearch && matchStatus;
  });

  return (
    <div>
      <div className="risk-toolbar">
        <div className="risk-toolbar-left">
          <input className="search-input" placeholder="Zoeken..." value={search} onChange={e => setSearch(e.target.value)} />
          <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} style={{width:'130px'}}>
            <option value="">Alle statussen</option>
            {STATUS_LIST.map(s => <option key={s}>{s}</option>)}
          </select>
        </div>
        <button className="btn btn-primary" onClick={onAdd}>+ Nieuw risico</button>
      </div>

      {filtered.length === 0 ? (
        <div className="empty">
          <div className="empty-icon">📋</div>
          <p>{risks.length === 0 ? 'Nog geen risico\'s. Voeg het eerste toe.' : 'Geen risico\'s gevonden.'}</p>
          {risks.length === 0 && <button className="btn btn-primary" onClick={onAdd}>+ Eerste risico toevoegen</button>}
        </div>
      ) : (
        <div className="table-wrap">
          <table className="risk-table">
            <thead>
              <tr>
                <th className="col-id">ID</th>
                <th>Ongewenste gebeurtenis</th>
                <th className="col-status">Status</th>
                <th className="col-score">Initieel</th>
                <th className="col-score">Restrisico</th>
                <th className="col-score">Actueel</th>
                <th className="col-actions"></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(r => (
                <RiskRow key={r.id} risk={r} onEdit={onEdit} onDelete={onDelete} />
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// Excel export — UMS format met kleuren en gegroepeerde headers
async function exportToExcel(project, risks) {
  if (!project?.id) { showToast('Geen project geselecteerd', 'error'); return; }
  showToast('Export wordt voorbereid...');

  let exportRisks = risks;
  try {
    const fresh = await sbFetch(`/risico_items?project_id=eq.${project.id}&order=volgnummer.asc`);
    if (fresh && fresh.length > 0) exportRisks = fresh;
  } catch(e) {}

  if (!exportRisks || exportRisks.length === 0) {
    showToast("Geen risico's om te exporteren", 'error');
    return;
  }

  const wb = XLSX.utils.book_new();
  const ws = {};
  const merges = [];

  // Helper: zet cel met waarde en stijl
  const C = (r, c) => XLSX.utils.encode_cell({r:r-1, c:c-1});

  const setCell = (row, col, value, style) => {
    const addr = C(row, col);
    ws[addr] = { v: value, t: typeof value === 'number' ? 'n' : 's', s: style };
  };

  const merge = (r1, c1, r2, c2) => merges.push({s:{r:r1-1,c:c1-1},e:{r:r2-1,c:c2-1}});

  // Stijlen
  const S = {
    HDR_GREEN:  { font:{bold:true,color:{rgb:'FFFFFF'},name:'Arial',sz:9}, fill:{fgColor:{rgb:'70AD47'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true} },
    HDR_CYAN:   { font:{bold:true,color:{rgb:'000000'},name:'Arial',sz:9}, fill:{fgColor:{rgb:'00B0F0'}}, alignment:{horizontal:'center',vertical:'center',wrapText:false} },
    HDR_SUB:    { font:{bold:true,color:{rgb:'000000'},name:'Arial',sz:9}, fill:{fgColor:{rgb:'92D050'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true} },
    DATA_W:     { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'FFFFFF'}}, alignment:{vertical:'center',wrapText:true} },
    DATA_G:     { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'F2F2F2'}}, alignment:{vertical:'center',wrapText:true} },
    DATA_WC:    { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'FFFFFF'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true} },
    DATA_GC:    { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'F2F2F2'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true} },
    PINK:       { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'FFB6C1'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true} },
    PINK_EUR:   { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'FFB6C1'}}, alignment:{horizontal:'center',vertical:'center',wrapText:true}, numFmt:'€ #,##0' },
    INFO_LBL:   { font:{bold:true,name:'Arial',sz:9}, alignment:{horizontal:'left',vertical:'center'} },
    INFO_VAL:   { font:{name:'Arial',sz:9}, alignment:{horizontal:'left',vertical:'center'} },
    EUR_W:      { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'FFFFFF'}}, alignment:{horizontal:'center',vertical:'center'}, numFmt:'€ #,##0' },
    EUR_G:      { font:{name:'Arial',sz:9}, fill:{fgColor:{rgb:'F2F2F2'}}, alignment:{horizontal:'center',vertical:'center'}, numFmt:'€ #,##0' },
  };

  // ---- Projectinfo rijen 1-5 ----
  const tsb = parseFloat(project?.tsb) || 0;
  const grootte = tsb < 5000000 ? 'Klein project' : tsb <= 12000000 ? 'Middelgroot' : 'Groot';
  [[1,'Project',project?.naam||''],[2,'TSB (conform BTO)',tsb],[3,'Projectgrootte',grootte],
   [4,'Opsteller',project?.opsteller||''],[5,'Datum laatste actualisatie',project?.datum_actualisatie||'']
  ].forEach(([row,lbl,val]) => {
    setCell(row, 5, lbl, S.INFO_LBL);
    setCell(row, 6, val, S.INFO_VAL);
  });

  // ---- Rij 7: gegroepeerde headers ----
  setCell(7, 12, 'INITIEEL', S.HDR_GREEN);           merge(7,12,7,18);
  setCell(7, 19, 'FINANCIËLE KWANTIFICERING', S.HDR_CYAN); merge(7,19,7,22);
  setCell(7, 27, 'RESTRISICO', S.HDR_GREEN);          merge(7,27,7,33);
  setCell(7, 34, 'FINANCIËLE KWANTIFICERING', S.HDR_CYAN); merge(7,34,7,37);

  // ---- Rij 8: kolomkoppen ----
  const H8 = [
    [2,'ID'],[3,'Deelproject'],[4,'Ongewenste gebeurtenis'],[5,'Oorzaak(en)'],[6,'Gevolg(en)'],
    [7,'Opmerking'],[8,'Status'],[9,'Risico-eigenaar'],[10,'Allocatie'],[11,'Fase'],
    [12,'Kans'],[13,'Tijd'],[14,'Geld'],[15,'Kwaliteit'],[16,'Veiligheid'],[17,'Omgeving'],[18,'Risico'],
    [19,'Kans'],[20,'Rekenwaarde kosten'],[21,'Restrisico bedrag'],[22,'Tijdsimpact'],
    [23,'Beheersmaatregel'],[24,'Actiehouder'],[25,'Deadline'],[26,'Opmerkingen'],

  ];
  H8.forEach(([col, lbl]) => setCell(8, col, lbl, S.HDR_SUB));

  // ---- Datarijen vanaf rij 10 ----
  const HIGH = 30;
  exportRisks.forEach((r, idx) => {

    const DW = even ? S.DATA_W : S.DATA_G;

    const PS = S.PINK, PE = S.PINK_EUR;

    setCell(row,2,r.volgnummer||'',DC);

    setCell(row,4,r.gebeurtenis||'',DW);

    // Initieel scores

      setCell(row,12+i, r[k]||'', pi?PS:DC);

    setCell(row,18,si||'',pi?PS:DC);
    setCell(row,19,`${Math.round(bI.kansRw*100)}%`,pi?PS:DC);
    setCell(row,20,bI.geldRw||'',pi?PE:EUR);
    setCell(row,21,bI.restrisicoBedrag?Math.round(bI.restrisicoBedrag):'',pi?PE:EUR);
    setCell(row,22,bI.tijdTekst||'',pi?PS:DC);

    setCell(row,23,r.beheersmaatregelen||'',DW);
    setCell(row,24,r.actiehouder||'',DC);
    setCell(row,25,r.deadline||'',DC);
    setCell(row,26,r.toelichting||'',DW);

    // Restrisico scores
    ['kans_r','tijd_r','geld_r','kwaliteit_r','veiligheid_r','omgeving_r'].forEach((k,i) => {
      setCell(row,27+i, r[k]||'', pr?PS:DC);

    setCell(row,33,sr||'',pr?PS:DC);
    setCell(row,34,`${Math.round(bR.kansRw*100)}%`,pr?PS:DC);
    setCell(row,35,bR.geldRw||'',pr?PE:EUR);
    setCell(row,36,bR.restrisicoBedrag?Math.round(bR.restrisicoBedrag):'',pr?PE:EUR);
    setCell(row,37,bR.tijdTekst||'',pr?PS:DC);
  });

  // Sheet range en merges
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0},e:{r:9+exportRisks.length,c:36}});
  ws['!merges'] = merges;
  ws['!cols'] = [
    {wch:2},{wch:6},{wch:12},{wch:40},{wch:35},{wch:35},{wch:25},
    {wch:12},{wch:16},{wch:12},{wch:12},
    {wch:6},{wch:6},{wch:6},{wch:8},{wch:8},{wch:8},{wch:8},

    {wch:6},{wch:6},{wch:6},{wch:8},{wch:8},{wch:8},{wch:8},
    {wch:8},{wch:14},{wch:14},{wch:14},
  ];
  ws['!rows'] = Array(9+exportRisks.length).fill(null).map((_,i) => ({hpt: i===7?36:i===6?18:45}));

  XLSX.utils.book_append_sheet(wb, ws, 'RISICOREGISTER');

  // Sheet 2: KWANTIFICEERTABELLEN
  const kwData = [
    ['Kwantificeertabel Kleine projecten','',5000000],
    ['Schaal','Kans','Tijd','Geld','Kwaliteit','Veiligheid','Omgeving','Rekenwaarde kans','Rekenwaarde kosten'],
    [0,'0','Geen impact','Geen impact','Geen impact','Geen impact','Geen impact',0,0],
    [1,'< 5 %','< 0.5 week','< € 5.000','Vragen binnen projectteam','Gering incident, geen EHBO','Interne aandacht',0.05,2500],
    [2,'5-15%','0.5 - 1 weken','€ 5.000 - €10.000','Onderzoek nodig','EHBO nodig','Lokale media',0.10,7500],
    [3,'15-25%','1 - 2 weken','€ 10.000 - € 25.000','Wijkt af van afspraak','Arts nodig','Sectoronrust',0.20,17500],
    [4,'25-35%','2 - 4 weken','€ 25.000 - € 50.000','Aanpassing/herstel mogelijk','Grote impact verzuim','Regionale media',0.30,37500],
    [5,'35-45%','4 - 6 weken','€ 50.000 - € 75.000','Herstel zichtbaar','Verzuim >7 weken','Nationale media beperkt',0.40,67500],
    [6,'45-55%','6 - 8 weken','€ 75.000 - € 100.000','Aanpassing specs nodig','Blijvend letsel','Nationale media aanzienlijk',0.50,87500],
    [7,'55-85%','> 2 maanden','> € 100.000','Niet herstelbaar','Dodelijk','Internationaal',0.70,100000],

  const ws2 = XLSX.utils.aoa_to_sheet(kwData);

// Import page
function ImportPage({ project, onDone, nextNum, risks }) {
  const [rows, setRows] = useState([]);        // { text, status: 'waiting'|'running'|'done'|'error', msg }
  const [importing, setImporting] = useState(false);
  const [done, setDone] = useState(false);
  const [progress, setProgress] = useState(0);
  const fileRef = useRef();
  const abortRef = useRef(false);

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
      // Collect rows: first column = gebeurtenis, optional second column = status
      const rows = data
        .filter(r => String(r[0] || '').trim().length > 0)
        .map(r => ({ text: String(r[0] || '').trim(), status: String(r[1] || '').trim() || 'Concept' }));
      // Skip header row if first cell looks like a header
      const start = (rows.length > 0 && /^[a-zA-Z\s]+$/.test(rows[0].text) && rows[0].text.length < 40) ? 1 : 0;
      const events = rows.slice(start);
      if (events.length === 0) { showToast('Geen regels gevonden in het bestand', 'error'); return; }
      setRows(events.map(t => ({ text: t.text, status: t.status, status_import: t.status, importStatus: 'waiting', msg: '' })));
      setDone(false);
      setProgress(0);
    };
    reader.readAsArrayBuffer(file);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  };

  const runImport = async () => {
    if (!project?.id) { showToast('Stel eerst een project in', 'error'); return; }
    if (rows.length === 0) return;
    setImporting(true);
    abortRef.current = false;
    let currentNext = nextNum;

    for (let i = 0; i < rows.length; i++) {
      if (abortRef.current) break;
      // Mark running
      setRows(r => r.map((row, idx) => idx === i ? { ...row, importStatus: 'running' } : row));

      let ai = null;
      let lastError = '';
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          if (attempt > 0) await new Promise(res => setTimeout(res, 3000 * attempt));
          ai = await analyzeRisk(rows[i].text);
          break;
        } catch (e) {
          lastError = e.message;
        }
      }

      if (!ai) {
        setRows(r => r.map((row, idx) => idx === i ? { ...row, importStatus: 'error', msg: lastError } : row));
        setProgress(Math.round(((i + 1) / rows.length) * 100));
        continue;
      }

      try {
        const validStatuses = ['Concept','Voorstel','Vigerend','Actueel','Beheerst','Vervallen','Opgetreden'];
        const importedStatus = rows[i].status_import;
        const status = validStatuses.includes(importedStatus) ? importedStatus : 'Concept';
        const scoreI = (ai.kans_i||0) * ((ai.tijd_i||0)+(ai.geld_i||0)+(ai.kwaliteit_i||0)+(ai.veiligheid_i||0)+(ai.omgeving_i||0));
        const payload = {
          project_id: project.id,
          volgnummer: currentNext + i,
          gebeurtenis: rows[i].text,
          oorzaken: ai.oorzaken || '',
          gevolgen: ai.gevolgen || '',
          beheersmaatregelen: ai.beheer || '',
          kans_i: ai.kans_i || 0,
          tijd_i: ai.tijd_i || 0,
          geld_i: ai.geld_i || 0,
          kwaliteit_i: ai.kwaliteit_i || 0,
          veiligheid_i: ai.veiligheid_i || 0,
          omgeving_i: ai.omgeving_i || 0,
          kans_r: ai.kans_r ?? 0,
          tijd_r: ai.tijd_r ?? 0,
          geld_r: ai.geld_r ?? 0,
          kwaliteit_r: ai.kwaliteit_r ?? 0,
          veiligheid_r: ai.veiligheid_r ?? 0,
          omgeving_r: ai.omgeving_r ?? 0,
          status,
          opmerking: ai.toelichting || ''
        };
        await sbFetch('/risico_items', { method: 'POST', body: JSON.stringify(payload) });
        setRows(r => r.map((row, idx) => idx === i ? { ...row, importStatus: 'done', msg: `Score: ${scoreI}` } : row));
      } catch (e) {
        setRows(r => r.map((row, idx) => idx === i ? { ...row, importStatus: 'error', msg: e.message } : row));
      }
      setProgress(Math.round(((i + 1) / rows.length) * 100));
      if (i < rows.length - 1) await new Promise(res => setTimeout(res, 1500));
    }
    setImporting(false);
    setDone(true);
    showToast(`Import klaar — ${rows.length} risico's verwerkt`, 'success');
  };

  const reset = () => { setRows([]); setDone(false); setProgress(0); };

  return (
    <div style={{maxWidth:'680px'}}>
      <div style={{marginBottom:'20px'}}>
        <h2 style={{fontSize:'18px',fontWeight:600,marginBottom:'4px'}}>Bulk importeren</h2>
        <p style={{color:'var(--text2)',fontSize:'13px'}}>Upload een Excel met ongewenste gebeurtenissen. De AI analyseert elke regel en vult oorzaken, gevolgen en scores in.</p>
      </div>

      {rows.length === 0 && (
        <div>
          <div
            className="dropzone"
            onClick={() => fileRef.current.click()}
            onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
            onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
            onDrop={handleDrop}
          >
            <div className="dropzone-icon">📂</div>
            <p>Klik om een bestand te kiezen, of sleep het hier naartoe</p>
            <small>Excel (.xlsx, .xls) — eerste kolom = ongewenste gebeurtenissen</small>
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e => handleFile(e.target.files[0])} />

          <div className="card" style={{marginTop:'20px'}}>
            <div className="card-title">Verwacht format</div>
            <div style={{background:'var(--bg3)',borderRadius:'6px',padding:'12px 16px',fontFamily:'var(--mono)',fontSize:'12px',color:'var(--text2)'}}>
              <div style={{color:'var(--text3)',marginBottom:'6px'}}>Kolom A (geen header vereist)</div>
              <div>ZRO's worden niet tijdig ondertekend</div>
              <div>MSR zijn niet tijdig geplaatst</div>
              <div>Beperkingen in de uitvoering</div>
              <div style={{color:'var(--text3)'}}>...</div>
            </div>
          </div>
        </div>
      )}

      {rows.length > 0 && (
        <div>
          {importing || done ? (
            <div className="import-progress">
              <div className="import-progress-label">
                <span>{done ? 'Klaar' : 'Bezig met analyseren...'}</span>
                <span style={{fontFamily:'var(--mono)'}}>{progress}%</span>
              </div>
              <div className="prog-bar"><div className="prog-fill" style={{width:`${progress}%`}} /></div>
            </div>
          ) : (
            <div style={{display:'flex',gap:'8px',marginBottom:'16px',alignItems:'center'}}>
              <button className="ai-btn" onClick={runImport}>
                <span>✦</span><span>Start AI-analyse ({rows.length} regels)</span>
              </button>
              <button className="btn btn-secondary" onClick={reset}>Ander bestand</button>
              <span style={{fontSize:'12px',color:'var(--text3)',marginLeft:'4px'}}>Duurt ~{Math.ceil(rows.length * 4)} seconden</span>
            </div>
          )}

          <div className="import-preview">
            {rows.map((row, i) => (
              <div key={i} className="import-row">
                <div className="import-row-num">#{i + 1}</div>
                <div className="import-row-text">{row.text}{row.status_import && row.status_import !== 'Concept' && <span style={{marginLeft:'6px',fontSize:'11px',color:'var(--text3)'}}>({row.status_import})</span>}</div>
                <div className="import-row-status">
                  {row.importStatus === 'waiting' && <span className="import-status-waiting">Wacht</span>}
                  {row.importStatus === 'running' && <span className="import-status-running"><div className="ai-spinner"/>Analyseren</span>}
                  {row.importStatus === 'done' && <span className="import-status-done">✓ {row.msg}</span>}
                  {row.importStatus === 'error' && <span className="import-status-error">✗ Fout</span>}
                </div>
              </div>
            ))}
          </div>

          {done && (
            <div style={{marginTop:'16px',display:'flex',gap:'8px'}}>
              <button className="btn btn-success" onClick={onDone}>Bekijk risico's →</button>
              <button className="btn btn-secondary" onClick={reset}>Nieuwe import</button>
            </div>
          )}

          {importing && (
            <button className="btn btn-danger btn-sm" style={{marginTop:'12px'}} onClick={() => { abortRef.current = true; }}>
              Stoppen
            </button>
          )}
        </div>
      )}
    </div>
  );
}

    const wb = XLSX.utils.book_new();

function App() {

  const [project, setProject] = useState(null);
  const [risks, setRisks] = useState([]);
  const [loading, setLoading] = useState(false);
  const [editingRisk, setEditingRisk] = useState(null);
  const [showEditor, setShowEditor] = useState(false);

  const loadRisks = async (pid) => {
    const r = await sbFetch(`/risico_items?project_id=eq.${pid}&order=volgnummer.asc`);
    setRisks(r || []);
  };

  const openProject = async (p) => {
    setProject(p);
    setLoading(true);
    await loadRisks(p.id);
    setLoading(false);
    setScreen('app');
    setPage('dashboard');
  };

  const handleProjectSave = async (p) => {
    setProject(p);
    if (p?.id) { await loadRisks(p.id); setScreen('app'); setPage('dashboard'); }
  };

  const handleAddRisk = () => { setEditingRisk(null); setShowEditor(true); setPage('risicos'); };
  const handleEditRisk = (r) => { setEditingRisk(r); setShowEditor(true); setPage('risicos'); };

  // Auto-sync uitvoeringsrisico's naar bibliotheek
  const syncToLibrary = async (risk, projectNaam) => {
    if (risk.fase !== 'Uitvoering') return;
    try {
      // Check if already in library (same gebeurtenis + bron_project)
      const existing = await sbFetch(`/risico_bibliotheek?gebeurtenis=eq.${encodeURIComponent(risk.gebeurtenis)}&bron_project=eq.${encodeURIComponent(projectNaam)}`);
      const payload = {
        gebeurtenis: risk.gebeurtenis,
        oorzaken: risk.oorzaken,
        gevolgen: risk.gevolgen,
        beheersmaatregelen: risk.beheersmaatregelen,
        kans_i: risk.kans_i, tijd_i: risk.tijd_i, geld_i: risk.geld_i,
        kwaliteit_i: risk.kwaliteit_i, veiligheid_i: risk.veiligheid_i, omgeving_i: risk.omgeving_i,
        kans_r: risk.kans_r, tijd_r: risk.tijd_r, geld_r: risk.geld_r,
        kwaliteit_r: risk.kwaliteit_r, veiligheid_r: risk.veiligheid_r, omgeving_r: risk.omgeving_r,
        bron_project: projectNaam
      };
      if (existing?.length > 0) {
        await sbFetch(`/risico_bibliotheek?id=eq.${existing[0].id}`, { method: 'PATCH', body: JSON.stringify(payload) });
      } else {
        await sbFetch('/risico_bibliotheek', { method: 'POST', body: JSON.stringify(payload) });
      }
    } catch(e) { /* silent */ }
  };

  const handleSaveRisk = async (form) => {
    if (!project?.id) { showToast('Stel eerst een project in', 'error'); return; }
    const payload = { ...form, project_id: project.id };
    if (form.id) {
      await sbFetch(`/risico_items?id=eq.${form.id}`, { method: 'PATCH', body: JSON.stringify(payload) });
    } else {
      await sbFetch('/risico_items', { method: 'POST', body: JSON.stringify(payload) });
    }
    // Sync to library if uitvoering
    if (form.fase === 'Uitvoering') await syncToLibrary(form, project.naam);
    await loadRisks(project.id);
    setShowEditor(false);
    setEditingRisk(null);
    showToast(form.fase === 'Uitvoering' ? 'Risico opgeslagen en toegevoegd aan uitvoeringsbibliotheek ✓' : 'Risico opgeslagen', 'success');
  };

  const handleDeleteRisk = async (r) => {
    if (!window.confirm(`Risico #${r.volgnummer} verwijderen?`)) return;
    await sbFetch(`/risico_items?id=eq.${r.id}`, { method: 'DELETE', prefer: '' });
    setRisks(rs => rs.filter(x => x.id !== r.id));
    showToast('Risico verwijderd');
  };

  // Import from bibliotheek into current project
  const handleBibliotheekImport = async (selected) => {
    if (!project?.id) { showToast('Geen project geselecteerd', 'error'); return; }
    let start = risks.length > 0 ? Math.max(...risks.map(r => r.volgnummer || 0)) + 1 : 1;
    for (const r of selected) {
      await sbFetch('/risico_items', { method: 'POST', body: JSON.stringify({
        project_id: project.id, volgnummer: start++,
        gebeurtenis: r.gebeurtenis, oorzaken: r.oorzaken, gevolgen: r.gevolgen,
        beheersmaatregelen: r.beheersmaatregelen,
        kans_i: r.kans_i, tijd_i: r.tijd_i, geld_i: r.geld_i,
        kwaliteit_i: r.kwaliteit_i, veiligheid_i: r.veiligheid_i, omgeving_i: r.omgeving_i,
        kans_r: r.kans_r, tijd_r: r.tijd_r, geld_r: r.geld_r,
        kwaliteit_r: r.kwaliteit_r, veiligheid_r: r.veiligheid_r, omgeving_r: r.omgeving_r,
        status: 'Concept', fase: 'Uitvoering'
      })});
    }
    await loadRisks(project.id);
    setPage('risicos');
    showToast(`${selected.length} risico's geïmporteerd uit bibliotheek`, 'success');
  };

  const nextNum = risks.length > 0 ? Math.max(...risks.map(r => r.volgnummer || 0)) + 1 : 1;

  // Project selector screen
  if (screen === 'selector') {
    return <ProjectSelector onSelect={openProject} onNew={() => setScreen('newproject')} />;
  }

  // New project screen
  if (screen === 'newproject') {
    return (
      <div style={{minHeight:'100vh',background:'var(--bg)',padding:'24px'}}>
        <div className="back-btn" onClick={() => setScreen('selector')}>← Terug naar projecten</div>
        <ProjectSetup project={null} onSave={handleProjectSave} />
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'var(--text2)',gap:'12px'}}>
        <div style={{width:'20px',height:'20px',border:'2px solid var(--border2)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} />
        Laden...
      </div>
    );
  }

  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: '◈' },
    { id: 'risicos', label: "Risico's", icon: '⚑' },
    { id: 'import', label: 'Importeren', icon: '↑' },
    { id: 'bibliotheek', label: 'Bibliotheek', icon: '📚' },
    { id: 'project', label: 'Project', icon: '⊙' },
  ];

  return (
    <div className="app">
      <div className="topbar">
        <div className="topbar-left">
          <div className="logo" style={{cursor:'pointer'}} onClick={() => setScreen('selector')}>RISICODOSSIER</div>
          {project && <div className="project-badge" style={{cursor:'pointer'}} onClick={() => setScreen('selector')}>{project.naam}{project.nummer ? ` · ${project.nummer}` : ''}</div>}
        </div>
        <div className="topbar-right">
          {project && (
            <button className="btn btn-success btn-sm" onClick={() => {
              showToast('Export wordt voorbereid...');
              window.location.href = `/api/export?project_id=${project.id}`;
            }}>↓ Excel exporteren</button>
          )}
          <button className="btn btn-primary btn-sm" onClick={handleAddRisk}>+ Risico</button>
        </div>
      </div>
      <div className="main">
        <div className="sidebar">
          {navItems.map(n => (
            <div key={n.id} className={`nav-item ${page === n.id && !showEditor ? 'active' : ''}`}
              onClick={() => { setPage(n.id); setShowEditor(false); }}>
              <span className="nav-icon">{n.icon}</span>
              {n.label}
              {n.id === 'risicos' && risks.filter(r => !['Vervallen','Beheerst'].includes(r.status)).length > 0 && (
                <span style={{marginLeft:'auto',fontSize:'11px',fontFamily:'var(--mono)',color:'var(--text3)'}}>
                  {risks.filter(r => !['Vervallen','Beheerst'].includes(r.status)).length}
                </span>
              )}
            </div>
          ))}
          <div style={{position:'absolute',bottom:'16px',left:'0',width:'200px',padding:'0 16px'}}>
            <div className="nav-item" style={{borderTop:'1px solid var(--border)',paddingTop:'12px'}}
              onClick={() => setScreen('selector')}>
              <span className="nav-icon">⇄</span> Wissel project
            </div>
          </div>
        </div>
        <div className="content">
          {page === 'dashboard' && !showEditor && <Dashboard risks={risks} project={project} />}
          {page === 'risicos' && (
            showEditor ? (
              <RiskEditor risk={editingRisk} nextNum={nextNum} onSave={handleSaveRisk}
                onCancel={() => { setShowEditor(false); setEditingRisk(null); }} />
            ) : (
              <RiskList risks={risks} onAdd={handleAddRisk} onEdit={handleEditRisk} onDelete={handleDeleteRisk} />
            )
          )}
          {page === 'import' && !showEditor && (
            <ImportPage project={project} onDone={async () => { await loadRisks(project.id); setPage('risicos'); }} nextNum={nextNum} risks={risks} />
          )}
          {page === 'bibliotheek' && !showEditor && (
            <BibliotheekPage onImport={handleBibliotheekImport} />
          )}
          {page === 'project' && !showEditor && (
            <ProjectSetup project={project} onSave={handleProjectSave} />
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('app'));
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</body>
</html>
